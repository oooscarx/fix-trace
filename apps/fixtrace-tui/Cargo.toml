[package]
name = "fixtrace-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Terminal user interface for FixTrace"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
fixtrace = { path = "../.." }
fixtrace-client = { path = "../../crates/fixtrace-client" }
fixtrace-protocol = { path = "../../crates/fixtrace-protocol" }
fixtrace-server = { path = "../fixtrace-server" }
futures-util = "0.3.34"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
ratatui-textarea = "0.9.2"
shell-words = "1.1"
tempfile = "3.23"
thiserror = "2.0"
textwrap = "0.16.2"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2.2"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
chrono = "0.4"
insta = "1.43"
