[package]
name = "fixtrace"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A replay-verified minimal repair agent for Rust/Cargo debugging sessions"
license = "MIT"

[workspace]
members = [
    ".",
    "apps/fixtrace-server",
    "apps/fixtrace-tui",
    "apps/fixtrace-desktop/src-tauri",
    "crates/fixtrace-client",
    "crates/fixtrace-presenter",
    "crates/fixtrace-protocol",
    "crates/fixtrace-store",
]
resolver = "3"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
hex = "0.4"
fixtrace-presenter = { path = "crates/fixtrace-presenter" }
fixtrace-protocol = { path = "crates/fixtrace-protocol" }
fixtrace-store = { path = "crates/fixtrace-store" }
nix = { version = "0.30", features = ["process", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
similar = "2.7"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
walkdir = "2.5"

[profile.release]
strip = true
lto = "thin"
