[package]
name = "fixtrace"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A replay-verified minimal repair agent for Rust/Cargo debugging sessions"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
strip = true
lto = "thin"

