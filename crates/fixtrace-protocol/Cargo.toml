[package]
name = "fixtrace-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Transport-neutral protocol types for FixTrace clients and servers"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde-json-impl", "uuid-impl"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
insta = { version = "1.43", features = ["json"] }
tempfile = "3.23"
