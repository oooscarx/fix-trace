[package]
name = "fixtrace-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Shared FixTrace client API with InProcess and reconnecting WebSocket transports"
license = "MIT"

[dependencies]
async-trait = "0.1"
fixtrace = { path = "../.." }
fixtrace-protocol = { path = "../fixtrace-protocol" }
futures-util = "0.3.34"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["net", "rt", "sync", "time"] }
tokio-tungstenite = "0.30.0"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.23"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
