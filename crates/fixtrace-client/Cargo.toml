[package]
name = "fixtrace-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Shared FixTrace client API and InProcess transport"
license = "MIT"

[dependencies]
async-trait = "0.1"
fixtrace = { path = "../.." }
fixtrace-protocol = { path = "../fixtrace-protocol" }
thiserror = "2.0"
tokio = { version = "1.47", features = ["sync"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
